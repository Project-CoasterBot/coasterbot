; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; PlatformIO Projektkonfiguration
; Arduino Nano mit zwei SG90 Servomotoren

[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino

; Alter Bootloader (bei "Programmer not responding" testen: nanoatmega328new)
; board = nanoatmega328new

monitor_speed = 115200
monitor_echo = true
lib_deps =
    ; Die Standard-Servo-Bibliothek ist in der Arduino-Framework bereits enthalten,
    ; wird hier aber trotzdem explizit gelistet:
    arduino-libraries/Servo @ ^1.2.1
