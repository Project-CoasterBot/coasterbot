#VRML_SIM R2023b utf8
# Coasterbot.proto
#
# Automatisch aus "Coasterbot-Assembly.step" abgeleitetes Webots-Robotermodell.
# Koordinatensystem-Konvention dieses PROTOs (Webots ist Y-up):
#   lokale +X  = links/rechts   (X<0 links, X>0 rechts)
#   lokale +Y  = oben
#   lokale +Z  = vorne/hinten   (Z<0 vorne, Z>0 hinten)
#
# Räder: Skid-Steer-Antrieb (alle 4 Räder drehen um die lokale X-Achse).
#   Die zwei Motoren je Seite sind gekoppelt (Webots "coupled motors",
#   gleicher Name vor "::"): ein Fahrbefehl an eine Seite treibt beide
#   Räder dieser Seite gemeinsam - wie beim realen Coasterbot.
#   Motoren: "wheel_left::front" + "wheel_left::rear" (Seite links, gekoppelt),
#            "wheel_right::front" + "wheel_right::rear" (Seite rechts, gekoppelt).
#   Encoder: "wheel_{front,rear}_{left,right}_sensor" (je Rad einzeln lesbar).
#   Lenken durch unterschiedliche Drehzahl links/rechts.
#
# Sensoren:
#   - "ultrasonic"                : Abstandssensor vorne mittig (sonar), schaut nach -Z
#   - "edge_front_left/right"     : Abstandssensoren an der vorderen Kante, schauen nach unten (-Y)
#   - "edge_rear_left/right"      : Abstandssensoren an der hinteren Kante, schauen nach unten (-Y)
#   - "inertial_unit"/"gyro"/"accelerometer" : IMU nahe dem Schwerpunkt
#
# WICHTIG: Die exakten Ausrichtungen/Positionen wurden aus der CAD-Geometrie
# berechnet, aber nicht in einer laufenden Webots-Instanz nachgeprueft. Bitte
# nach dem Import ueberpruefen (Sensor-Rays einblenden: View / Optional
# Rendering / Show Distance Sensor Rays) und ggf. leicht nachjustieren.

PROTO Coasterbot [
  field SFVec3f     translation      0 0 0
  field SFRotation  rotation         0 1 0 0
  field SFString    name             "Coasterbot"
  field SFString    controller       "<generic>"
  field MFString    controllerArgs   []
  field SFString    customData       ""
  field SFBool      supervisor       FALSE
  field SFBool      synchronization  TRUE
]
{
  Robot {
    translation IS translation
    rotation IS rotation
    name IS name
    controller IS controller
    controllerArgs IS controllerArgs
    customData IS customData
    supervisor IS supervisor
    synchronization IS synchronization
    children [
      # ---------------------------------------------------------------
      # Chassis (alle statischen Teile zu einem Mesh zusammengefasst:
      # Base, Motorhalter, Aussenwaende, Ultraschallhalter, KantenErkhalter,
      # Kantenabdeckung, Gear Motors, CoasterMechanism, Deckel)
      # ---------------------------------------------------------------
      DEF CHASSIS_SHAPE Shape {
        appearance PBRAppearance {
          baseColor 0.82 0.83 0.85
          roughness 0.65
          metalness 0.1
        }
        geometry Mesh {
          url "meshes/chassis.stl"
        }
      }

      # ---------------------------------------------------------------
      # Raeder (je ein HingeJoint, Achse = lokale X-Achse)
      #
      # Die beiden Motoren einer Seite sind ueber Webots "coupled motors"
      # (gleicher Name vor "::") gekoppelt: ein Fahrbefehl an einen der
      # beiden treibt automatisch auch den anderen. Das bildet den realen
      # Coasterbot ab, bei dem die zwei TT-Motoren einer Seite gemeinsam
      # angesteuert werden. Der Controller kennt nur "wheel_left" bzw.
      # "wheel_right".
      # ---------------------------------------------------------------
      DEF WHEEL_FRONT_LEFT HingeJoint {
        jointParameters HingeJointParameters {
          axis 1 0 0
          anchor -0.101 0.0345 -0.0566

        }
        device [
          RotationalMotor {
            name "wheel_left::front"
            maxVelocity 20
            maxTorque 0.6
            multiplier 1
          }
          PositionSensor {
            name "wheel_front_left_sensor"
          }
        ]
        endPoint Solid {
          translation -0.101 0.0345 -0.0566
          rotation 0 0 1 0
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 0.9
              }
              geometry Mesh {
                url "meshes/wheel_fl.stl"
              }
            }
          ]
          name "wheel_front_left"
          boundingObject Transform {
            rotation 0 1 0 1.57
            children [ Cylinder { radius 0.035 height 0.031 } ]
          }
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }

      DEF WHEEL_REAR_LEFT HingeJoint {
        jointParameters HingeJointParameters {
          axis 1 0 0
          anchor -0.101 0.0345 0.0566
        }
        device [
          RotationalMotor {
            name "wheel_left::rear"
            maxVelocity 20
            maxTorque 0.6
            multiplier 1
          }
          PositionSensor {
            name "wheel_rear_left_sensor"
          }
        ]
        endPoint Solid {
          translation -0.101 0.0345 0.0566
          rotation 0 0 1 0
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 0.9
              }
              geometry Mesh {
                url "meshes/wheel_rl.stl"
              }
            }
          ]
          name "wheel_rear_left"
          boundingObject Transform {
            rotation 0 1 0 1.57
            children [ Cylinder { radius 0.035 height 0.031 } ]
          }
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }

      DEF WHEEL_REAR_RIGHT HingeJoint {
        jointParameters HingeJointParameters {
          axis 1 0 0
          anchor 0.101 0.0345 0.0566
        }
        device [
          RotationalMotor {
            name "wheel_right::rear"
            maxVelocity 20
            maxTorque 0.6
            multiplier 1
          }
          PositionSensor {
            name "wheel_rear_right_sensor"
          }
        ]
        endPoint Solid {
          translation 0.101 0.0345 0.0566
          rotation 0 0 1 0
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 0.9
              }
              geometry Mesh {
                url "meshes/wheel_rr.stl"
              }
            }
          ]
          name "wheel_rear_right"
          boundingObject Transform {
            rotation 0 1 0 1.57
            children [ Cylinder { radius 0.035 height 0.031 } ]
          }
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }

      DEF WHEEL_FRONT_RIGHT HingeJoint {
        jointParameters HingeJointParameters {
          axis 1 0 0
          anchor 0.1012 0.0345 -0.0566
        }
        device [
          RotationalMotor {
            name "wheel_right::front"
            maxVelocity 20
            maxTorque 0.6
            multiplier 1
          }
          PositionSensor {
            name "wheel_front_right_sensor"
          }
        ]
        endPoint Solid {
          translation 0.1012 0.0345 -0.0566
          rotation 0 0 1 0
          children [
            Shape {
              appearance PBRAppearance {
                baseColor 0.05 0.05 0.05
                roughness 0.9
              }
              geometry Mesh {
                url "meshes/wheel_fr.stl"
              }
            }
          ]
          name "wheel_front_right"
          boundingObject Transform {
            rotation 0 1 0 1.57
            children [ Cylinder { radius 0.035 height 0.031 } ]
          }
          physics Physics {
            density -1
            mass 0.05
          }
        }
      }

      # ---------------------------------------------------------------
      # Ultraschallsensor (vorne, mittig) - "Ultraschallhalter"
      # ---------------------------------------------------------------
      DistanceSensor {
        translation 0 0.057 -0.093
        rotation 0 1 0 1.5708
        name "ultrasonic"
        # HC-SR04-like model: approximately 2 cm minimum range, 4 m maximum
        # range, and a narrow acoustic beam of approximately 15 degrees.
        type "sonar"
        lookupTable [
          0.02 0.02 0
          4 4 0.02
        ]
        numberOfRays 5
        aperture 0.26
      }

      # ---------------------------------------------------------------
      # Kanten-/Abstandssensoren (KantenErkhalter vorne + hinten),
      # je ein Sensor pro Ecke, nach unten gerichtet (-Y)
      # ---------------------------------------------------------------
      DistanceSensor {
        translation -0.09 0.041 -0.0915
        rotation 0 0 1 -1.5708
        name "edge_front_left"
        type "infra-red"
        # Digitales Kantensignal (kein analoges Distanzsignal): das reale
        # Sensormodul hat einen eingebauten Komparator und liefert bereits
        # 0/1 an seinem Ausgangspin, keine Rohspannung. Der Uebergang liegt
        # hier bei 0.099 m (Sensor sitzt ~0.041 m ueber dem Boden) - darunter
        # "Boden vorhanden" -> 0, darueber (auch "unendlich" ueber der
        # Tischkante) -> 1. Die 2 mm Rampe zwischen 0.098 und 0.10 m ist nur
        # numerische Interpolation, kein simuliertes Analogverhalten.
        lookupTable [
          0     0 0
          0.098 0 0
          0.10  1 0
          4     1 0
        ]
      }
      DistanceSensor {
        translation 0.09 0.041 -0.0915
        rotation 0 0 1 -1.5708
        name "edge_front_right"
        type "infra-red"
        # Digitales Kantensignal - siehe Kommentar bei "edge_front_left".
        lookupTable [
          0     0 0
          0.098 0 0
          0.10  1 0
          4     1 0
        ]
      }
      DistanceSensor {
        translation -0.09 0.041 0.0914
        rotation 0 0 1 -1.5708
        name "edge_rear_left"
        type "infra-red"
        # Digitales Kantensignal - siehe Kommentar bei "edge_front_left".
        lookupTable [
          0     0 0
          0.098 0 0
          0.10  1 0
          4     1 0
        ]
      }
      DistanceSensor {
        translation 0.09 0.041 0.0914
        rotation 0 0 1 -1.5708
        name "edge_rear_right"
        type "infra-red"
        # Digitales Kantensignal - siehe Kommentar bei "edge_front_left".
        lookupTable [
          0     0 0
          0.098 0 0
          0.10  1 0
          4     1 0
        ]
      }

      # ---------------------------------------------------------------
      # Inertialsensor (IMU) nahe dem Schwerpunkt.
      #
      # Modelliert den auf der Stueckliste gefuehrten Inertialsensor
      # (BOM Pos. 11: "ICQUANZX GY-521 MPU6050; Navigationssensor" =
      # ein GY-521-Breakout-Board mit InvenSense-MPU-6050-Chip, 6-DOF
      # Gyro+Beschleunigungssensor). Messbereich und Aufloesung stammen
      # aus dem MPU-6050-Datenblatt (Werksdefault FS_SEL=0/AFS_SEL=0,
      # 16-Bit-ADC); Rauschen und Nullpunktfehler des Gyros sind in
      # Webots' lookupTable-Rauschen NICHT geeignet abbildbar (das
      # skaliert mit dem Momentanwert, ist bei Stillstand also immer 0 -
      # ein realer Gyro rauscht aber auch im Stillstand). Deshalb werden
      # Bias und Rauschen stattdessen in WebotsHAL::getGyroZ() simuliert
      # (siehe dort); hier steht nur Messbereich + Aufloesung.
      # ---------------------------------------------------------------
      InertialUnit {
        translation 0 0.05 0
        name "inertial_unit"
      }
      Gyro {
        translation 0 0.05 0
        name "gyro"
        # MPU-6050, FS_SEL=0 (Werksdefault): Messbereich +-250 deg/s =
        # +-4.363323 rad/s; 16-Bit-ADC -> Aufloesung 250/32768 deg/s
        # = 0.00013316 rad/s. lookupTable bildet nur Messbereich +
        # Interpolation ab (Rauschspalte bewusst 0, siehe oben).
        lookupTable [
          -4.363323 -4.363323 0
           4.363323  4.363323 0
        ]
        resolution 0.00013316
      }
      Accelerometer {
        translation 0 0.05 0
        name "accelerometer"
        # Gleicher Chip (MPU-6050), Beschleunigungskanal: AFS_SEL=0
        # (Werksdefault) -> Messbereich +-2 g = +-19.62 m/s^2 (g = 9.81
        # m/s^2, wie WorldInfo.gravity); 16-Bit-ADC -> Aufloesung
        # 19.62/32768 = 0.0005987 m/s^2. Vom Controller aktuell nicht
        # ausgelesen (siehe Softwaredokumentation) - hier trotzdem
        # realitaetsnah abgebildet, da Teil desselben Bauteils.
        lookupTable [
          -19.62 -19.62 0
           19.62  19.62 0
        ]
        resolution 0.0005987
      }
    ]
    # ---------------------------------------------------------------
    # Kollisionsgeometrie des Chassis, zusammengesetzt aus zwei Boxen,
    # damit sie sich NICHT mit den Raedern ueberschneidet (das
    # urspruengliche einteilige Box-boundingObject war breiter/tiefer
    # als der Freiraum zwischen den Raedern und ueberlappte deren
    # Kollisionszylinder in X und Y -> staendige Durchdringung ->
    # der Roboter "tanzte"/zitterte beim Fahren):
    #   1) unterer, schmaler Teil: passt zwischen die vier Raeder
    #      (|x| <= 0.082, unterhalb bleibt Freiraum fuer die Raeder)
    #   2) oberer, breiter Teil: liegt oberhalb der Raeder
    #      (y >= Rad-Oberkante ~0.070) und darf die volle Chassisbreite
    #      haben, da er dort nicht mehr mit den Raedern kollidiert
    # ---------------------------------------------------------------
    boundingObject Group {
      children [
        Transform {
          translation 0 0.0607 0
          children [
            Box {
              size 0.164 0.090 0.216
            }
          ]
        }
        Transform {
          translation 0 0.084 0
          children [
            Box {
              size 0.236 0.020 0.216
            }
          ]
        }
      ]
    }
    physics Physics {
      density -1
      mass 0.4
      centerOfMass [ 0 0.0507 0 ]
    }
  }
}
