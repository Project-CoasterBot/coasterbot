; CoasterBot Coaster-Test als eigenstaendiges PlatformIO-Projekt.
;
; Baut dieselben Quellen wie ../platformio.ini (dort Umgebung pico2_coaster_test), aber nur den Test
; von Coaster-Ausgabe und -Aufnahme, siehe ../coaster_test.h. Lokale Einstellungen kommen wie dort
; aus ../boardconfig_local.h. Board- und Compilereinstellungen wie in ../platformio.ini halten.
;
;     pio run -t upload       # in diesem Verzeichnis
;     pio device monitor

[platformio]
src_dir = ..
include_dir = ..
default_envs = coaster_test

[env:coaster_test]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

build_src_filter =
    +<*.c>
    +<*.cpp>
    +<webots/*.cpp>
    -<.pio/>
    -<.idea/>
    -<coaster_test/>

build_unflags = -std=gnu++17
build_flags = -std=gnu++20 -Wall -DDEBUG_RP2040_PORT=Serial -Wl,-u,_printf_float -DCOASTERBOT_COASTER_TEST

monitor_speed = 115200
monitor_port = /dev/ttyACM0
