; CoasterBot Firmware - Raspberry Pi Pico 2 (RP2350), Arduino-Framework.
;
; Der Arduino-Core fuer den RP2350 ist "arduino-pico" von Earle F. Philhower
; (https://github.com/earlephilhower/arduino-pico). In PlatformIO wird er ueber
; den Fork platform-raspberrypi von maxgerhardt eingebunden - nur der kennt die
; RP2350-Boards und den earlephilhower-Core.
;
; Bauen / Flashen / Konsole:
;     pio run                 # baut .pio/build/pico2/firmware.uf2
;     pio run -t upload       # flasht (BOOTSEL-Taster oder picotool-Reset)
;     pio device monitor      # serielle Konsole ueber USB-CDC

[platformio]
; Das Projekt liegt flach in src/ - Quellen und Header im selben Verzeichnis,
; statt der PlatformIO-Standardaufteilung src/ + include/.
src_dir = .
include_dir = .
default_envs = pico2

[env:pico2]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2
framework = arduino
board_build.core = earlephilhower

; Nur die Quellen dieses Projekts uebersetzen (src_dir = . wuerde sonst auch
; Build- und IDE-Verzeichnisse einsammeln).
build_src_filter =
    +<*.c>
    +<*.cpp>
    +<webots/*.cpp>
    -<.pio/>
    -<.idea/>

; ledinterface.h nutzt Templates/constexpr im C++20-Stil.
build_unflags = -std=gnu++17
; DEBUG_RP2040_PORT: std::cout/printf der Webots-Klassen ([NAV], [LEARN], [SAFETY], ...) auf die
; USB-Konsole. Ohne das Define verwirft arduino-pico alles, was nicht direkt ueber Serial geht.
; -u _printf_float: die Plattform linkt newlib-nano (--specs=nano.specs), dort ist %f ohne dieses Symbol
; leer - betrifft Serial.printf ebenso wie std::cout << float (laeuft intern ueber vsnprintf).
build_flags = -std=gnu++20 -Wall -DDEBUG_RP2040_PORT=Serial -Wl,-u,_printf_float

; printf()/Serial gehen ueber USB-CDC (dasselbe Kabel wie zur Stromversorgung).
; Der UART auf GP0/GP1 bleibt frei - dort haengen laut Pinbelegung die
; vorderen Tischkantensensoren.
monitor_speed = 115200
monitor_port = /dev/ttyACM0
